<style>
  /* barvy okna – tmavé výchozí, světlé podle systému nebo po přepnutí (stejné nastavení jako web) */
  :root { --dlg-bg: #0F1A2C; --dlg-text: #E8EEF5; --dlg-muted: #9AA8BA; --dlg-input: #0A1426; --dlg-border: rgba(150, 185, 230, .25);
    --dlg-strong: #fff; --dlg-shadow: rgba(0, 0, 0, .8); --veil: rgba(4, 8, 15, .85); --veil-2: rgba(4, 8, 15, .45); --fake: #E8EEF5;
    --err: #FF8A8A; --show-d: block; --show-l: none; --tg-sun: block; --tg-moon: none; color-scheme: dark; }
  @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
    --dlg-bg: #fff; --dlg-text: #132033; --dlg-muted: #5B6878; --dlg-input: #F4F7FA; --dlg-border: rgba(20, 40, 70, .18);
    --dlg-strong: #0B1422; --dlg-shadow: rgba(15, 40, 80, .45); --veil: rgba(245, 247, 250, .8); --veil-2: rgba(245, 247, 250, .35); --fake: #132033;
    --err: #D0312D; --show-d: none; --show-l: block; --tg-sun: none; --tg-moon: block; color-scheme: light; } }
  :root[data-theme="light"] {
    --dlg-bg: #fff; --dlg-text: #132033; --dlg-muted: #5B6878; --dlg-input: #F4F7FA; --dlg-border: rgba(20, 40, 70, .18);
    --dlg-strong: #0B1422; --dlg-shadow: rgba(15, 40, 80, .45); --veil: rgba(245, 247, 250, .8); --veil-2: rgba(245, 247, 250, .35); --fake: #132033;
    --err: #D0312D; --show-d: none; --show-l: block; --tg-sun: none; --tg-moon: block; color-scheme: light; }
  .logo-d { display: var(--show-d); } .logo-l { display: var(--show-l); }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #04080F; font: 16px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif; }
  /* rozmazaný web v pozadí */
  .bg { position: fixed; inset: -24px; background: url(assets/img/hero.jpg) 60% center / cover; filter: blur(14px) saturate(1.1); transform: scale(1.04); }
  .bg::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, var(--veil), var(--veil-2)); transition: background .3s; }
  .fake { position: fixed; inset: 0; filter: blur(5px); opacity: .55; pointer-events: none; }
  .fake__bar { height: 76px; display: flex; align-items: center; gap: 28px; padding: 0 max(24px, calc(50% - 600px)); }
  .fake__bar img { width: 170px; }
  .fake__bar i { display: block; width: 70px; height: 9px; border-radius: 5px; background: var(--fake); opacity: .6; }
  .fake__hero { padding: 16vh max(24px, calc(50% - 600px)) 0; }
  .fake__hero i { display: block; height: 52px; border-radius: 8px; background: var(--fake); margin-bottom: 18px; opacity: .8; }
  .fake__hero i:nth-child(1) { width: min(560px, 80%); } .fake__hero i:nth-child(2) { width: min(420px, 60%); background: #1E8BFF; }
  .fake__hero b { display: block; width: min(460px, 70%); height: 14px; border-radius: 7px; background: #9AA8BA; margin: 34px 0 12px; opacity: .6; }

  /* vyskakovací okno */
  dialog { width: min(400px, calc(100vw - 32px)); padding: 0; border: 0; border-radius: 20px; color: var(--dlg-text); background: var(--dlg-bg);
    box-shadow: 0 40px 100px -20px var(--dlg-shadow), 0 0 0 1px var(--dlg-border); overflow: hidden; transition: background .3s, color .3s; }
  dialog::backdrop { background: rgba(2, 4, 10, .35); }
  dialog[open] { animation: pop .35s cubic-bezier(.2, .9, .3, 1.2); }
  @keyframes pop { from { opacity: 0; transform: translateY(14px) scale(.96); } }
  dialog.shake { animation: shake .4s; }
  @keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
  .dlg__head { display: flex; align-items: center; gap: 12px; padding: 18px 22px; background: linear-gradient(120deg, #0646B8, #1580F5 60%, #4CC4FF); }
  .dlg__head svg { width: 22px; height: 22px; flex: none; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .dlg__head strong { font-size: 15px; letter-spacing: .1em; text-transform: uppercase; color: #fff; flex: 1; }
  .theme-toggle { width: 34px; height: 34px; display: grid; place-items: center; padding: 0; border-radius: 50%; cursor: pointer; color: #fff;
    border: 1px solid rgba(255, 255, 255, .45); background: rgba(255, 255, 255, .12); transition: transform .3s, background .2s; }
  .theme-toggle:hover { background: rgba(255, 255, 255, .25); transform: rotate(15deg); }
  .theme-toggle svg { width: 18px !important; height: 18px !important; fill: none; stroke: #fff; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  .theme-toggle .i-sun { display: var(--tg-sun); } .theme-toggle .i-moon { display: var(--tg-moon); }
  form { display: grid; gap: 14px; padding: 24px 22px 22px; }
  .dlg__logo { width: 150px; margin: 0 auto 2px; }
  .dlg__text { margin: 0; text-align: center; color: var(--dlg-muted); font-size: 14.5px; }
  .pw { position: relative; }
  .pw input { width: 100%; box-sizing: border-box; height: 50px; padding: 0 48px 0 14px; border-radius: 10px; border: 1.5px solid var(--dlg-border);
    background: var(--dlg-input); color: var(--dlg-strong); font-size: 17px; }
  .pw input:focus { outline: none; border-color: #1E8BFF; box-shadow: 0 0 0 4px rgba(30, 139, 255, .2); }
  .pw button { position: absolute; right: 6px; top: 6px; width: 38px; height: 38px; border: 0; border-radius: 8px; background: transparent; color: var(--dlg-muted); cursor: pointer; }
  .pw button:hover { color: var(--dlg-strong); }
  .pw svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; }
  .remember { display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--dlg-muted); cursor: pointer; }
  .remember input { accent-color: #1E8BFF; width: 17px; height: 17px; margin: 0; }
  .go { height: 50px; border: 0; border-radius: 10px; cursor: pointer; color: #fff; font-weight: 700; font-size: 14px; letter-spacing: .12em; text-transform: uppercase;
    background: linear-gradient(120deg, #0646B8, #1580F5 55%, #4CC4FF); box-shadow: 0 10px 30px -10px rgba(30, 139, 255, .7); }
  .go[disabled] { opacity: .6; cursor: progress; }
  .err { min-height: 1.3em; margin: -4px 0 0; text-align: center; color: var(--err); font-size: 14px; }
</style>

  </div>
  <form id="f">

    <label class="remember"><input type="checkbox" id="rm" checked>Zapamatovat na tomto zařízení</label>
    <button type="submit" class="go">Vstoupit na web</button>
    <p class="err" id="err" role="alert"></p>
  </form>
</dialog>

  const KEY = 'xpools-zamek-' + D.salt;
  const bytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const store = { get: () => { try { return localStorage.getItem(KEY) || sessionStorage.getItem(KEY); } catch (e) { return null; } },
    set: (v, keep) => { try { (keep ? localStorage : sessionStorage).setItem(KEY, v); } catch (e) {} },
    clear: () => { try { localStorage.removeItem(KEY); sessionStorage.removeItem(KEY); } catch (e) {} } };
  const importKey = raw => crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
  const decrypt = async raw => new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(D.iv) }, await importKey(raw), bytes(D.ct)));

  async function show(html) {
    // dokud prohlížeč čte tuto stránku, document.open() nic neudělá – počkáme na dočtení
    if (document.readyState === 'loading') await new Promise(r => document.addEventListener('DOMContentLoaded', r, { once: true }));
    document.open(); document.write(html); document.close();
    if (location.hash) setTimeout(() => { const t = document.getElementById(decodeURIComponent(location.hash.slice(1))); if (t) t.scrollIntoView(); }, 300);
  }
  async function derive(pw) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
    return new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: bytes(D.salt), iterations: D.iter, hash: 'SHA-256' }, base, 256));
  }

  const dlg = document.getElementById('dlg');
  dlg.addEventListener('cancel', e => e.preventDefault()); // okno nejde zavřít klávesou Esc
  const ask = () => { if (!dlg.open) dlg.showModal(); };
  const saved = store.get();
  if (saved) decrypt(bytes(saved)).then(show).catch(() => { store.clear(); ask(); });
  else ask();

  // přepínač režimu – volba platí i pro web po odemčení
  document.getElementById('theme').addEventListener('click', () => {
    const root = document.documentElement;
    const cur = root.dataset.theme || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    root.dataset.theme = window.__xpT = cur === 'dark' ? 'light' : 'dark';
    try { sessionStorage.setItem('xpools-theme', root.dataset.theme); } catch (e) {}
  });
  // když uživatel změní režim v systému, stránka ho hned následuje
  matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => {
    delete document.documentElement.dataset.theme;
    window.__xpT = 'system';
    try { sessionStorage.removeItem('xpools-theme'); } catch (e) {}
  });

  const pw = document.getElementById('pw');
  document.getElementById('eye').addEventListener('click', () => { pw.type = pw.type === 'password' ? 'text' : 'password'; pw.focus(); });
  document.getElementById('f').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = e.target.querySelector('.go'), err = document.getElementById('err'), keep = document.getElementById('rm').checked;
    btn.disabled = true; err.textContent = '';
    let raw, html;
    try {
      raw = await derive(pw.value);
      html = await decrypt(raw);
    } catch (x) {
      err.textContent = 'Nesprávné heslo.';
      btn.disabled = false;
      dlg.classList.remove('shake'); void dlg.offsetWidth; dlg.classList.add('shake');
      pw.select();
      return;
    }
    // klíč uložíme ještě před vykreslením – po něm už formulář na stránce není
    store.set(btoa(String.fromCharCode(...raw)), keep);
    show(html);
  });
})();
